<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appointment Requested — wbook365</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 to-teal-50 flex items-center justify-center p-4">
  <div class="max-w-md w-full">
    <div class="bg-white rounded-2xl shadow-lg border border-gray-100 p-8 text-center">
      <div class="w-16 h-16 rounded-full bg-teal-100 flex items-center justify-center mx-auto mb-4">
        <i class="fas fa-check text-teal-600 text-2xl"></i>
      </div>
      <h1 class="text-2xl font-bold text-gray-900 mb-2" style="font-family:'DM Serif Display',serif;">Request Sent!</h1>
      <p class="text-gray-500 text-sm mb-6">Your appointment request with Dr. {{ doctor.user.name }} has been submitted. You will receive a confirmation email once approved.</p>
      <a href="{% url 'public_booking' slug=doctor.user.slug %}" class="inline-block bg-teal-600 hover:bg-teal-700 text-white font-semibold px-6 py-3 rounded-xl transition">Book Another</a>
    </div>
    <p class="text-center text-xs text-gray-400 mt-4">Powered by wbook365</p>
  </div>
</body>
</html>
