{% load i18n %}
<!DOCTYPE html>
<html lang="{% get_current_language as LANGUAGE_CODE %}{{ LANGUAGE_CODE }}">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% trans "Trial Expired" %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 to-slate-800 flex items-center justify-center p-4">
  <div class="max-w-md w-full">
    <div class="bg-white rounded-2xl shadow-2xl p-8 text-center">
      <div class="w-16 h-16 rounded-full bg-amber-100 flex items-center justify-center mx-auto mb-4">
        <i class="fas fa-lock text-amber-500 text-2xl"></i>
      </div>
      <h1 class="text-2xl font-bold text-gray-900 mb-2" style="font-family:'DM Serif Display',serif;">{% trans "Trial Expired" %}</h1>
      <p class="text-gray-500 text-sm mb-6">{% trans "Your free trial has ended" %}. {% trans "Please contact support to continue using wbook365." %}</p>
      <a href="mailto:support@wbook365.com" class="inline-block bg-teal-600 hover:bg-teal-700 text-white font-semibold px-6 py-3 rounded-xl transition mb-3">{% trans "Contact Support" %}</a>
      <br>
      <form action="/accounts/logout/" method="post" class="inline">{% csrf_token %}<button type="submit" class="text-sm text-gray-400 hover:text-gray-600 mt-2">{% trans "Sign out" %}</button></form>
    </div>
  </div>
</body>
</html>
