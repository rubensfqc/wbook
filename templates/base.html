<!doctype html>
{% get_current_language as LANG %}
<html lang="{{ LANG }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}wbook{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}{% translate 'Agenda online, portal do paciente e orçamentos para dentistas.' %}{% endblock %}">
  {% include "components/favicons.html" %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}" {% block body_attrs %}{% endblock %}>
  {% include "components/messages.html" %}
  {% block body %}{% endblock %}
  <script src="{% static 'vendor/htmx/htmx.min.js' %}"></script>
  <script src="{% static 'js/app.js' %}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
