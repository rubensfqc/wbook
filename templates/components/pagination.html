{% if page.has_other_pages %}
<nav class="mt-4 flex items-center justify-between text-sm">
  <span class="text-slate-500">{% blocktranslate with n=page.number t=page.paginator.num_pages %}Página {{ n }} de {{ t }}{% endblocktranslate %}</span>
  <span class="flex gap-2">
    {% if page.has_previous %}<a class="btn-secondary btn-sm" href="?{% for k, v in request.GET.items %}{% if k != 'pagina' %}{{ k }}={{ v|urlencode }}&amp;{% endif %}{% endfor %}pagina={{ page.previous_page_number }}">{% translate 'Anterior' %}</a>{% endif %}
    {% if page.has_next %}<a class="btn-secondary btn-sm" href="?{% for k, v in request.GET.items %}{% if k != 'pagina' %}{{ k }}={{ v|urlencode }}&amp;{% endif %}{% endfor %}pagina={{ page.next_page_number }}">{% translate 'Próxima' %}</a>{% endif %}
  </span>
</nav>
{% endif %}
