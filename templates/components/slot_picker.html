<div id="slot-picker" class="space-y-3">
  <div class="flex items-center justify-between gap-2">
    {% if can_prev %}<button type="button" class="btn-secondary btn-sm" hx-get="{{ times_url }}?tipo={{ appt_type.pk }}&semana={{ prev_week }}{% if reschedule_of %}&remarcar={{ reschedule_of.pk }}{% endif %}" hx-target="#slot-picker" hx-swap="outerHTML">{% icon 'chevron-left' %}<span class="hidden sm:inline">{% translate 'Semana anterior' %}</span></button>{% else %}<span></span>{% endif %}
    <p class="text-sm font-medium text-slate-700">{% blocktranslate with d=this_week|date:"d/m" %}Semana de {{ d }}{% endblocktranslate %}</p>
    <button type="button" class="btn-secondary btn-sm" hx-get="{{ times_url }}?tipo={{ appt_type.pk }}&semana={{ next_week }}{% if reschedule_of %}&remarcar={{ reschedule_of.pk }}{% endif %}" hx-target="#slot-picker" hx-swap="outerHTML"><span class="hidden sm:inline">{% translate 'Próxima semana' %}</span>{% icon 'chevron-right' %}</button>
  </div>
  <div class="grid grid-cols-2 gap-2 sm:grid-cols-4 lg:grid-cols-7">
    {% for day, times in days %}
    <div class="rounded-xl p-2 {% if times %}bg-white ring-1 ring-slate-200{% else %}bg-slate-50 text-slate-400{% endif %}">
      <p class="mb-2 text-center text-xs font-semibold uppercase tracking-wide">{{ day|date:"D" }} <span class="font-normal">{{ day|date:"d/m" }}</span></p>
      <div class="space-y-1.5">
        {% for t in times %}
          <button type="button" class="slot-btn" data-slot="{{ t.isoformat }}" data-label="{{ t|local_dt:dentist }}">{{ t|local_time:dentist }}</button>
        {% empty %}<p class="py-2 text-center text-xs">—</p>{% endfor %}
      </div>
    </div>
    {% endfor %}
  </div>
</div>
